name: Portfolio CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: portfolio-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-and-build:
    name: Validate and package website
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Build and validate static site
        run: python scripts/build_site.py

      - name: Upload validated site artifact
        uses: actions/upload-artifact@v4
        with:
          name: portfolio-site
          path: dist/
          if-no-files-found: error
          retention-days: 7
